<div class="card" [style.background-color]="hero.completata ? 'lightgreen'
: 'white'">
<h3>{{ hero.nome }}</h3>
<p>Potere: {{ hero.potere }}</p>
<button class="btn-done" (click)="notifyParent()" [disabled]="hero.completata">
  Missione Compiuta
</button>

<button [routerLink]="['/insert' , hero.id]" class="btn-edit" >
  Edit ✏️
</button>

</div>
